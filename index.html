<html lang="id">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Opname Material</title>
<style>
:root{--pr:#2e407d;--pr2:#4a65a0;--ac:#ff9800;--ok:#2e9e5b;--bad:#e53935;--bg:#f3f5fb;--card:#fff;--tx:#1d2340;--tx2:#7a819c;--bd:#e4e7f2;--r:20px;--sh:0 6px 18px rgba(46,64,125,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh}
.app{max-width:520px;margin:0 auto;min-height:100dvh;position:relative;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.view{display:none}.view.on{display:block}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;touch-action:manipulation}
input{font:inherit}
.hero{background:linear-gradient(160deg,var(--pr) 0%,#5a76c4 100%);color:#fff;padding:calc(20px + env(safe-area-inset-top)) 20px 64px;border-radius:0 0 32px 32px}
.hero h1{margin:0;font-size:26px}.hero p{margin:2px 0 0;opacity:.8;font-size:13px}
.hero-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ring{position:relative;flex:none}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px}
.who{margin:-44px 16px 0;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who label{font-size:11px;color:var(--tx2);font-weight:600}
.who input{width:100%;border:1.5px solid var(--bd);border-radius:12px;padding:10px;background:#fafbff;color:var(--tx)}
.stats{display:flex;gap:8px;margin:14px 16px 0}
.stat{flex:1;background:var(--card);border-radius:16px;padding:10px;text-align:center;box-shadow:var(--sh)}
.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--tx2)}
h2{font-size:17px;margin:20px 16px 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.ac{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px 12px;text-align:center;border:0;color:var(--tx)}
.ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:24px;margin:0 auto 8px;box-shadow:0 4px 10px rgba(0,0,0,.08)}
.ac b{display:block;font-size:14px}.ac small{color:var(--tx2)}
.bar{height:6px;background:var(--bd);border-radius:9px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .3s}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(488px,calc(100% - 32px));background:var(--pr);color:#fff;font-weight:700;font-size:16px;padding:16px;box-shadow:0 10px 24px rgba(46,64,125,.35);z-index:5}
.top{background:linear-gradient(160deg,var(--ac),#ffb74d);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 18px;border-radius:0 0 28px 28px}
.top-row{display:flex;align-items:center;gap:10px}
.back{background:rgba(255,255,255,.25);color:#fff;width:38px;height:38px;font-size:18px}
.top h1{margin:0;font-size:22px;flex:1}
.search{margin-top:12px;width:100%;border:0;border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.95);color:var(--tx)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
.chip{flex:none;background:var(--card);color:var(--tx2);padding:8px 14px;border-radius:999px;font-weight:600;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.chip.on{background:var(--pr);color:#fff}
.list{padding:8px 16px;display:grid;gap:10px}
.it{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:14px;text-align:left;width:100%;color:var(--tx);border-left:5px solid var(--bd)}
.it.done{border-left-color:var(--ok)}
.it .nm{flex:1;font-weight:600;font-size:14px}.it .nm small{display:block;color:var(--tx2);font-weight:500}
.it .qty{font-size:22px;font-weight:800;color:var(--pr);text-align:right;min-width:56px}
.it .qty small{display:block;font-size:10px;color:var(--tx2);font-weight:600}
.it.todo .qty{color:#c3c8dc}
.empty{text-align:center;color:var(--tx2);padding:30px}
.back-sh{position:fixed;inset:0;background:rgba(20,26,56,.55);display:none;z-index:20}.back-sh.on{display:block}
.sheet{position:fixed;left:50%;transform:translate(-50%,100%);bottom:0;width:min(520px,100%);max-height:94dvh;overflow:auto;background:#fff;border-radius:28px 28px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));z-index:21;transition:transform .25s}
.sheet.on{transform:translate(-50%,0)}
.grab{width:44px;height:5px;background:var(--bd);border-radius:9px;margin:0 auto 10px}
.sh-h{display:flex;justify-content:space-between;gap:10px}.sh-h b{font-size:16px}.sh-h small{color:var(--tx2);display:block}
.x{background:var(--bg);width:36px;height:36px;color:var(--tx2);font-size:16px;flex:none}
.big{text-align:center;margin:8px 0 4px}.big b{font-size:60px;line-height:1;color:var(--pr)}.big small{display:block;color:var(--tx2)}
.tally{min-height:36px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;margin-bottom:10px}
.tally svg{stroke:var(--pr);stroke-width:2.6;stroke-linecap:round}.tally span{font-size:12px;color:var(--tx2)}
.tap{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}
.tap button{background:#e8edff;color:var(--pr);font-weight:800;font-size:20px;padding:20px 0}
.tap .p1{background:var(--pr);color:#fff;font-size:28px;grid-row:span 1}
.row{display:flex;gap:8px;margin-top:10px}
.row input{flex:1;min-width:0;border:1.5px solid var(--bd);border-radius:14px;padding:12px;background:#fafbff}
.btn{background:var(--ac);color:#fff;font-weight:700;padding:12px 16px}
.btn2{background:var(--bg);color:var(--tx);font-weight:600;padding:12px 14px}
.lots{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lot{background:#eef1fb;border-radius:999px;padding:6px 6px 6px 12px;font-weight:700;color:var(--pr);font-size:13px}
.lot button{background:none;color:var(--bad);padding:0 6px;font-size:14px}
.lbl{font-size:12px;color:var(--tx2);font-weight:600;margin-top:12px}
.nx{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:14px}
.nx .btn{background:var(--ok)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin:12px 16px;padding:14px}
.card h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between}
.card ul{margin:6px 0 0;padding-left:18px;color:var(--tx2);font-size:13px}.card li{padding:3px 0}
.card li a{color:var(--pr);font-weight:600}
.acts{display:grid;gap:10px;margin:14px 16px}.acts .btn{padding:16px;font-size:16px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);display:flex;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -6px 20px rgba(46,64,125,.12);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}
.nav button{flex:1;background:none;color:var(--tx2);font-size:20px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button span{font-size:11px;font-weight:600}.nav button.on{color:var(--pr)}
.top.bl{background:linear-gradient(160deg,var(--pr),#5a76c4);padding-bottom:44px}
.top.bl p{margin:2px 0 0;opacity:.85;font-size:12px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:-30px 16px 0}
.sum div{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:12px}
.sum small{color:var(--tx2);font-size:11px;font-weight:600}.sum b{display:block;font-size:22px;color:var(--pr)}
.rk{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:14px;border-left:5px solid var(--bd)}
.rk.full{border-left-color:var(--ok)}.rk.part{border-left-color:var(--ac)}
.rk-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rk-h .nm{font-weight:600;font-size:14px}.rk-h .nm small{display:block;color:var(--tx2);font-weight:500}
.rk-h .qty{font-size:24px;font-weight:800;color:var(--pr);text-align:right}.rk-h .qty small{display:block;font-size:10px;color:var(--tx2);font-weight:600}

.loc.no{background:#f0f1f6;color:var(--tx2);font-weight:600}
.all{background:#f3f6ff;border-radius:14px;padding:10px 12px;margin:0 0 10px;font-size:13px;color:var(--tx2)}.all b{color:var(--pr);font-size:16px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:#1d2340;color:#fff;padding:12px 18px;border-radius:14px;z-index:40;font-size:14px;max-width:90%;display:none}
.toast.err{background:var(--bad)}.toast.ok{background:var(--ok)}

.backend-status{display:inline-flex;align-items:center;margin-top:8px;font-size:12px;font-weight:700;opacity:.95}.backend-status.ok{color:#b9ffd0}.backend-status.bad{color:#ffd0d0}.backend-status.loading{color:#fff2b2}

    function getMaterialCategory(nama) {
      if (nama.startsWith('INNER')) return 'INNER';
      if (nama.startsWith('KARDUS')) return 'KARDUS';
      if (nama.startsWith('POUCH')) return 'POUCH';
      if (nama.startsWith('LABEL')) return 'LABEL';
      if (nama.startsWith('JERIGEN')) return 'JERIGEN';
      if (nama.startsWith('Sticker') || nama.startsWith('STICKER')) return 'STICKER';
      if (nama.startsWith('LAKBAN')) return 'LAKBAN';
      if (nama.startsWith('BADAN LB')) return 'BADAN LB';
      if (nama.startsWith('TUTUP LB')) return 'TUTUP LB';
      if (nama.startsWith('TUTUP DALAM') || nama.startsWith('TUTUP LUAR')) return 'TUTUP JERIGEN';

function rReview(){
 const T=totalAll(),D=doneAll();let rj=0;Object.values(st.items).forEach(it=>rj+=it.x||0);
 $('v-review').innerHTML=`<div class="top"><div class="top-row"><button class="back" id="bk2">←</button><h1>Review &amp; Kirim</h1></div></div>
 <div class="stats"><div class="stat"><b style="color:var(--ok)">${D}</b><span>Dihitung</span></div><div class="stat"><b style="color:var(--bad)">${T-D}</b><span>Belum</span></div><div class="stat"><b>${fmt(rj)}</b><span>Total rusak</span></div></div>
 ${AREAS.map(a=>{const un=AREA_CONFIG[a].map((m,i)=>[m,i]).filter(([m])=>!done(a,m));return `<div class="card"><h3><span>${esc(a)}</span><span>${cnt(a)}/${AREA_CONFIG[a].length}</span></h3>${un.length?`<details><summary style="color:var(--tx2);font-size:13px">${un.length} belum dihitung</summary><ul>${un.map(([m,i])=>`<li><a href="#" data-a="${esc(a)}" data-i="${i}">${esc(m.nama)}</a></li>`).join('')}</ul></details>`:'<small style="color:var(--ok)">✓ Semua sudah dihitung</small>'}</div>`}).join('')}
 <div class="acts"><button class="btn" id="snd" style="background:var(--pr)">☁️ Simpan ke Google Drive</button><button class="btn" id="csv" style="background:var(--ok)">⬇ Unduh CSV (cadangan)</button><button class="btn2" id="clr" style="padding:14px">🗑️ Hapus semua data</button></div>`;
 $('bk2').onclick=()=>go('home');
 document.querySelectorAll('#v-review a').forEach(a=>a.onclick=e=>{e.preventDefault();curArea=a.dataset.a;cat='SEMUA';q='';todo=false;show('area');rArea();openSheet(+a.dataset.i)});
 $('snd').onclick=submit;$('csv').onclick=exportCsv;
 $('clr').onclick=()=>{if(confirm('Hapus SEMUA data opname di perangkat ini?')){st={nama:st.nama,tanggal:today(),items:{}};save();toast('Data dihapus','ok');go('home')}};
}
async function submit(){
 if(!st.nama){toast('Isi nama pelaksana dulu','err');return}
 const un=totalAll()-doneAll();
 if(un&&!confirm(`${un} item belum dihitung dan tidak ikut terkirim. Lanjut kirim?`))return;
 const entries=[];
 AREAS.forEach(a=>AREA_CONFIG[a].forEach(m=>{
   const f=fld(a,m),it=st.items[f];
   if(!it||!it.c)return;
   const L=LAST[f],stokAwal=L?Number(L.v)||0:0,masuk=mk_(it),stokAkhir=tot(it),rusak=Number(it.x)||0;
   entries.push({
     mid:String(m.mid||''),area:a,material:m.nama,nama:m.nama,satuan:m.satuan,
     stokAwal,masuk,stokAkhir,terpakai:stokAwal+masuk-stokAkhir,rusak,
     tally:Number(it.t)||0,lot:Array.isArray(it.e)?it.e:[]
   });
 }));
 if(!entries.length){toast('Belum ada material yang dihitung','err');return}
 const b=$('snd');b.disabled=true;b.textContent='☁️ Menyimpan ke Google Drive...';
 const payload={action:'saveOpname',data:{type:'STOCK_OPNAME',version:'2.0',header:{tanggal:st.tanggal,shift:String(st.shift),pelaksana:st.nama},entries}};
 try{
   const r=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
   if(!r.ok)throw new Error('HTTP '+r.status);
   const j=await r.json();
   if(j.status&&j.status!=='ok')throw new Error(j.message||'Gagal menyimpan');
   st.sent=Date.now();
   entries.forEach(x=>{const f=fld(x.area,{nama:x.material});LAST[f]={v:x.stokAkhir,tgl:st.tanggal,shift:st.shift}});
   try{localStorage.setItem('opname_last',JSON.stringify(LAST))}catch{}
   save();
   toast('✅ Opname tersimpan ke Google Drive','ok');
   if(confirm('Data berhasil disimpan. Mulai periode opname baru? Stok fisik ini akan menjadi acuan stok awal berikutnya.')){
     st.items={};save();go('home');
   }
 }catch(e){
   console.error(e);
   toast('❌ Gagal simpan. Data tetap aman di perangkat. Cek koneksi / URL Apps Script.','err');
 }finally{b.disabled=false;b.textContent='☁️ Simpan ke Google Drive'}
}

function exportCsv(){
 const rows=[['Tanggal','Pelaksana','Area','Material','Shift','Satuan','Awal','Masuk','Stok','Terpakai','Rusak']];
 AREAS.forEach(a=>AREA_CONFIG[a].forEach(m=>{const it=st.items[fld(a,m)];if(it&&it.c){const L=LAST[fld(a,m)];rows.push([st.tanggal,st.nama,a,m.nama,st.shift,m.satuan,L?L.v:'',mk_(it),fmt(tot(it)),L?fmt(L.v+mk_(it)-tot(it)):'',it.x||0])}}));
 const csv='\ufeff'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`Opname_${st.tanggal}.csv`;a.click();
}
render();checkBackend().then(()=>syncMasterMaterials());
</script>
</body>
